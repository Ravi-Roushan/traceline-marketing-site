name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token; id-token+pages are required by the official
# deploy-pages action to publish via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: node build.js
        # No SITE_BASE_PATH / subpath configuration needed: build.js
        # rewrites every internal href/src to be document-relative
        # (see src/lib/paths.js), so the same output works unmodified
        # at a domain root, a custom domain, or a GitHub Pages project
        # subpath like https://<user>.github.io/<repo>/.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish ONLY the built output — src/, build.js, docs/, etc.
          # never reach the live site.
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
